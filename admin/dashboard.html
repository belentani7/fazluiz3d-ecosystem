<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZLUIZ3D - Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050505;color:#F5F5F7;font-family:system-ui;display:grid;grid-template-columns:250px 1fr;height:100vh}
        .sidebar{background:#0A0A0C;border-right:1px solid rgba(201,169,110,.1);padding:2rem 0}
        .sidebar-logo{padding:0 1.5rem 2rem;font-weight:800;color:#C9A96E;letter-spacing:2px}
        .sidebar nav a{display:block;padding:1rem 1.5rem;color:#8E8E93;border-left:3px solid transparent;transition:.3s;cursor:pointer}
        .sidebar nav a:hover,.sidebar nav a.active{border-left-color:#C9A96E;color:#C9A96E}
        .main{display:flex;flex-direction:column}
        .header{border-bottom:1px solid rgba(201,169,110,.1);padding:1.5rem 2rem;background:#0A0A0C}
        .content{flex:1;overflow-y:auto;padding:2rem}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;margin-bottom:2rem}
        .stat-card{background:#111116;border:1px solid rgba(201,169,110,.1);border-radius:8px;padding:1.5rem;text-align:center}
        .stat-val{font-size:2.5rem;font-weight:800;color:#C9A96E;margin-bottom:.5rem}
        table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:2rem;background:#111116;border:1px solid rgba(201,169,110,.1);border-radius:8px;overflow:hidden}
        th{background:#0A0A0C;padding:1rem;text-align:left;color:#C9A96E;text-transform:uppercase;font-size:.75rem;border-bottom:1px solid rgba(201,169,110,.1)}
        td{padding:1rem;border-bottom:1px solid rgba(201,169,110,.05)}
        .section{display:none}
        .section.active{display:block}
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">FAZLUIZ3D</div>
    <nav>
        <a class="nav active" data-sec="dash">Dashboard</a>
        <a class="nav" data-sec="leads">Leads</a>
        <a class="nav" data-sec="orders">Órdenes</a>
    </nav>
</div>

<div class="main">
    <div class="header">
        <h1>Dashboard</h1>
    </div>
    <div class="content">
        <div id="dash" class="section active">
            <div class="stats">
                <div class="stat-card"><div class="stat-val" id="s1">0</div>Leads</div>
                <div class="stat-card"><div class="stat-val" id="s2">0</div>Nuevos</div>
                <div class="stat-card"><div class="stat-val" id="s3">0</div>Órdenes</div>
                <div class="stat-card"><div class="stat-val" id="s4">0</div>Pendientes</div>
            </div>
            <table><thead><tr><th>Nombre</th><th>Email</th><th>Estado</th></tr></thead><tbody id="t1"></tbody></table>
        </div>
        <div id="leads" class="section">
            <table><thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Mensaje</th></tr></thead><tbody id="t2"></tbody></table>
        </div>
        <div id="orders" class="section">
            <table><thead><tr><th>ID</th><th>Cliente</th><th>Descripción</th><th>Estado</th></tr></thead><tbody id="t3"></tbody></table>
        </div>
    </div>
</div>

<script src="../assets/js/local-db.js"></script>
<script>
(function(){
  'use strict';
  document.querySelectorAll('.nav').forEach(function(a){a.addEventListener('click',function(e){
    document.querySelectorAll('.nav').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.section').forEach(function(x){x.classList.remove('active')});
    e.currentTarget.classList.add('active');
    document.getElementById(e.currentTarget.dataset.sec).classList.add('active');
  })});
  function cell(value){var td=document.createElement('td');td.textContent=value || '—';return td}
  function rowLead(lead){var tr=document.createElement('tr');tr.appendChild(cell(lead.name));tr.appendChild(cell(lead.email));tr.appendChild(cell(lead.phone));tr.appendChild(cell(lead.message));return tr}
  function load(){
    return Promise.all([window.FazluizDB.list('leads'),window.FazluizDB.list('quotes')]).then(function(values){
      var leads=values[0],quotes=values[1];
      document.getElementById('s1').textContent=leads.length;
      document.getElementById('s2').textContent=leads.filter(function(x){return x.status==='new'}).length;
      document.getElementById('s3').textContent=quotes.length;
      document.getElementById('s4').textContent=quotes.filter(function(x){return x.urgency==='express'}).length;
      var t1=document.getElementById('t1'),t2=document.getElementById('t2');
      t1.replaceChildren();t2.replaceChildren();
      leads.slice().reverse().forEach(function(lead){
        var a=document.createElement('tr');a.appendChild(cell(lead.name));a.appendChild(cell(lead.email));a.appendChild(cell(lead.status));t1.appendChild(a);
        t2.appendChild(rowLead(lead));
      });
      var t3=document.getElementById('t3');t3.replaceChildren();
      quotes.slice().reverse().forEach(function(quote){var tr=document.createElement('tr');tr.appendChild(cell(quote.id));tr.appendChild(cell(quote.material));tr.appendChild(cell(quote.estimate ? quote.estimate+' EUR' : '—'));tr.appendChild(cell(quote.urgency));t3.appendChild(tr)});
    });
  }
  load();
})();
</script>

</body>
</html>
